<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quantum Componentes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body
    class="bg-zinc-950 text-zinc-100 min-h-screen p-6 flex justify-center items-center"
  >
    <div
      class="w-full max-w-6xl border border-zinc-800 bg-zinc-900/50 rounded-2xl p-6 shadow-2xl"
    >
  <header class="mb-6 flex items-center gap-3">
  <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-black text-lg shadow-lg shadow-indigo-600/30">
    Q
  </div>
  <div>
    <h1 class="text-xl font-bold tracking-tight text-white">Quantum Componentes</h1>
    <p class="text-sm text-zinc-400">
      Tu tienda de componentes para gaming
    </p>
  </div>
</header>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
        <input
          type="text"
          id="input-buscar"
          placeholder="Buscar producto..."
          class="bg-zinc-900 border border-zinc-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500 placeholder-zinc-500"
        />
        <select
          id="select-categoria"
          class="bg-zinc-900 border border-zinc-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500 text-zinc-300"
        >
          <option value="todas">Categoría ▾</option>
          <option value="Audio">Audio</option>
          <option value="Perifericos">Periféricos</option>
          <option value="Muebles">Muebles</option>
          <option value="Componentes">Componentes</option>
        </select>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div
          id="contenedor-catalogo"
          class="lg:col-span-2 grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4"
        ></div>

        <aside
          class="border border-zinc-800 bg-zinc-900/80 rounded-xl p-4 flex flex-col justify-between h-fit"
        >
          <div>
            <h2 class="text-lg font-semibold mb-4">Tu carrito</h2>

            <div
              id="contenedor-carrito"
              class="space-y-3 mb-4 max-h-64 overflow-y-auto pr-1"
            >
            </div>
          </div>

          <div class="border-t border-zinc-800 pt-4">
            <div class="flex justify-between items-center mb-4">
              <span class="text-sm font-medium text-zinc-400">Total</span>
              <span id="total-carrito" class="text-lg font-bold"></span>
            </div>
            <button
              id="btn-pagar"
              class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg text-sm transition mb-2"
            >
              Ir a pagar
            </button>
            <button
              id="btn-vaciar"
              class="w-full bg-transparent hover:bg-zinc-800 text-zinc-400 hover:text-zinc-200 font-medium py-2 rounded-lg text-xs transition border border-zinc-800"
            >
              Vaciar carrito
            </button>

            <section id="section-checkout" class="hidden mt-4 border-t border-zinc-800 pt-4">
              <h3 class="text-sm font-bold mb-3">Datos para el envío</h3>
              <form id="form-checkout" class="flex flex-col gap-2.5">
                    <div>
                        <label class="block text-[11px] text-zinc-400 mb-1">Nombre completo</label>
                        <input type="text" id="checkout-nombre" required class="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-indigo-500" />
                    </div>
                    <div>
                        <label class="block text-[11px] text-zinc-400 mb-1">Correo electrónico</label>
                        <input type="email" id="checkout-email" required class="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-indigo-500" />
                    </div>
                    <div>
                        <label class="block text-[11px] text-zinc-400 mb-1">Dirección de entrega</label>
                        <input type="text" id="checkout-direccion" required class="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-indigo-500" />
                    </div>
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 rounded-lg text-xs transition mt-1">
                        Confirmar datos
                    </button>
                </form>
            </section>
          </div>
        </aside>
      </div>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
